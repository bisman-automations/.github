# Reusable "draft release" workflow for every bisman-automations Home Assistant
# integration. Called from each repo's .github/workflows/draft-release.yml on
# every push to main:
#
#   on:
#     push:
#       branches: [main]
#     workflow_dispatch:
#   permissions:
#     contents: write
#   jobs:
#     draft:
#       uses: bisman-automations/.github/.github/workflows/ha-draft-release.yml@main
#
# The release process (the same in every repo)
# --------------------------------------------
# 1. In the release commit, bump "version" in
#    custom_components/<domain>/manifest.json and write the notes under a new
#    CHANGELOG.md heading "## [X.Y.Z] - YYYY-MM-DD". There is no
#    "## [Unreleased]" section.
# 2. Push to main.
# 3. This workflow creates (or refreshes) a DRAFT release vX.Y.Z:
#      - notes: that version's CHANGELOG.md section,
#      - a "Commits" list since the previous release, and a compare link,
#      - <domain>.zip, the integration folder's contents, for manual installs.
# 4. Donavan reviews the draft and publishes it. Publishing creates the tag;
#    nothing here ever publishes a release or pushes a tag.
#
# Details
# -------
# - When manifest.json's version is already published (a push with no version
#   bump), the draft is for the next patch version. Its notes would come from
#   that next version's "## [X.Y.Z] - YYYY-MM-DD" section, which is written
#   in the release commit, so the draft says the section is missing and asks
#   for the bump. It does not read an [Unreleased] section.
# - Previous releases whose tag isn't in main's history (for example after a
#   history rewrite) are matched to the commit on main with the exact same
#   files, so the commit list and compare link still work. Failing that, they
#   are matched to the amended copy of the tagged commit (same author, author
#   date and subject), with a warning that the amendment's own changes aren't
#   listed. When neither exists the commit list is left out with a warning
#   instead of failing. Tags are never moved.
# - Drafts this workflow made for other versions are removed (they carry a
#   hidden marker). Drafts made by hand are never touched. A draft this
#   workflow already untagged (its name is still the tag and its body still
#   has the marker) is adopted and retagged, not replaced.
# - Updating a draft always sends tag_name. Omitting it makes GitHub rewrite
#   the pending tag to untagged-<id>, after which an upload by tag fails
#   with "release not found". The zip is uploaded to the release id instead.
# - Versions containing a, b or rc (for example 1.4.0b1) are marked pre-release.

name: Home Assistant integration draft release

on:
  workflow_call:
    inputs:
      zip-asset:
        description: Attach <domain>.zip (the integration folder) to the draft.
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    concurrency:
      # One draft update at a time per repository; never cancel one midway.
      group: draft-release-${{ github.repository }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
      MARKER: "<!-- auto-draft-release -->"
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags, to list the commits since the last release.
          fetch-depth: 0
          fetch-tags: true

      - name: Work out the version to draft
        id: version
        run: |
          set -euo pipefail
          manifest=$(ls custom_components/*/manifest.json)
          if [ "$(echo "$manifest" | wc -l)" -ne 1 ]; then
            echo "::error::Expected exactly one custom_components/<domain>/manifest.json, found: ${manifest}"
            exit 1
          fi
          domain=$(jq -r .domain "$manifest")
          version=$(jq -r .version "$manifest")
          tag="v${version}"
          notes_section="$version"

          gh api --paginate "repos/${REPO}/releases?per_page=100" | jq -s 'add // []' > releases.json

          # Already published: there is no [Unreleased] section to draft from.
          # The next version's notes are written under ## [X.Y.Z] - YYYY-MM-DD
          # in the release commit that also bumps manifest.json. Until that
          # commit, draft the next patch and let the notes step say the
          # section is missing.
          if jq -e --arg t "$tag" 'any(.[]; .tag_name == $t and (.draft | not))' releases.json >/dev/null; then
            IFS=. read -r major minor patch <<<"${version%%[-+ab]*}"
            next="${major}.${minor}.$((patch + 1))"
            tag="v${next}"
            notes_section="$next"
            echo "::notice::${version} is already released, so this drafts ${tag}. Add '## [${next}] - YYYY-MM-DD' and bump manifest.json in the release commit. There is no [Unreleased] section to take notes from."
          fi

          prerelease=false
          if [[ "${tag#v}" =~ (a|b|rc)[0-9]*$ ]]; then prerelease=true; fi

          {
            echo "domain=${domain}"
            echo "version=${version}"
            echo "tag=${tag}"
            echo "notes_section=${notes_section}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"
          echo "Drafting ${tag} for ${domain} (manifest.json ${version}, notes from CHANGELOG.md [${notes_section}])"

      - name: Write the release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          NOTES_SECTION: ${{ steps.version.outputs.notes_section }}
        run: |
          set -euo pipefail

          # 1. This version's CHANGELOG.md section (## [X.Y.Z], never Unreleased).
          python3 - <<'PY'
          import os
          import re
          import sys

          wanted = os.environ["NOTES_SECTION"]
          lines = open("CHANGELOG.md", encoding="utf-8").read().splitlines()
          heading = re.compile(r"^## \[(?P<name>[^\]]+)\]")
          link_ref = re.compile(r"^\[[^\]]+\]:\s*\S+")
          out, found = [], False
          for line in lines:
              match = heading.match(line)
              if match:
                  if found:
                      break
                  found = match.group("name") == wanted
                  continue
              if found and not link_ref.match(line):
                  out.append(line)
          text = "\n".join(out).strip()
          if not found or not text:
              print(f"::warning::CHANGELOG.md has no entries under [{wanted}]; the draft says so. Add them before publishing.")
              text = f"_No CHANGELOG.md entries under [{wanted}] yet._"
          open("notes.md", "w", encoding="utf-8").write(text + "\n")
          PY

          # 2. The previous published release, and where it sits on main.
          previous=$(jq -r '[.[] | select((.draft | not) and (.prerelease | not))][0].tag_name // empty' releases.json)
          base=""
          if [ -n "$previous" ] && git rev-parse -q --verify "refs/tags/${previous}" >/dev/null; then
            if git merge-base --is-ancestor "refs/tags/${previous}" "$SHA"; then
              base="$previous"
            else
              # The tag isn't in main's history (history was rewritten after it
              # was released). Find the commit on main with the same files.
              tree=$(git rev-parse "refs/tags/${previous}^{tree}")
              base=$(git log --format='%H %T' "$SHA" | awk -v t="$tree" '$2 == t { print $1; exit }')
              if [ -n "$base" ]; then
                echo "::notice::${previous} isn't in main's history; listing commits since ${base:0:7}, the commit on main with the same files."
              else
                # No identical files: look for the amended or rebased copy of
                # the tagged commit (same author, author date and subject).
                key=$(git log -1 --format='%ae%x09%at%x09%s' "refs/tags/${previous}")
                base=$(git log --format='%H%x09%ae%x09%at%x09%s' "$SHA" |
                  awk -F '\t' -v k="$key" '{ h = $1; sub(/^[^\t]*\t/, ""); if ($0 == k) { print h; exit } }')
                if [ -n "$base" ]; then
                  echo "::warning::${previous} isn't in main's history. ${base:0:7} on main is the same commit amended after the tag, so the commit list starts there; changes made by that amendment aren't listed. Check that CHANGELOG.md covers them."
                else
                  echo "::warning::${previous} isn't in main's history and no commit on main matches it, so the draft has no commit list. See the repository's CLAUDE.md."
                fi
              fi
            fi
          fi

          {
            cat notes.md
            if [ -n "$base" ]; then
              commits=$(git log --reverse --no-merges --format='- %s (%h)' "${base}..${SHA}")
              if [ -n "$commits" ]; then
                printf '\n### Commits\n\n%s\n' "$commits"
              fi
              printf '\n**Full changelog**: https://github.com/%s/compare/%s...%s\n' "$REPO" "$base" "$TAG"
            fi
            printf '\n%s\n' "$MARKER"
          } > body.md
          echo "----- release notes -----"
          cat body.md

      - name: Build the integration zip
        if: inputs.zip-asset
        env:
          DOMAIN: ${{ steps.version.outputs.domain }}
        run: |
          set -euo pipefail
          # The folder's contents at the zip's root, the layout HACS's
          # zip_release uses: unzip into config/custom_components/<domain>/.
          python3 - <<'PY'
          import os
          import pathlib
          import zipfile

          domain = os.environ["DOMAIN"]
          root = pathlib.Path("custom_components") / domain
          with zipfile.ZipFile(f"{domain}.zip", "w", zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(root.rglob("*")):
                  if path.is_file() and "__pycache__" not in path.parts and path.suffix != ".pyc":
                      zf.write(path, path.relative_to(root))
          PY
          python3 -m zipfile -l "${DOMAIN}.zip" | head -n 40

      - name: Create or update the draft
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          DOMAIN: ${{ steps.version.outputs.domain }}
          ZIP: ${{ inputs.zip-asset }}
        run: |
          set -euo pipefail
          body=$(cat body.md)

          # Adopt this version's draft. A previous run may already have untagged
          # it: a PATCH that omits tag_name makes GitHub rewrite the pending tag
          # to untagged-<id>, while the name stays $TAG and the body still
          # carries this workflow's marker. Treat that as the same draft so we
          # retag it instead of opening a second one.
          draft_id=$(jq -r --arg t "$TAG" --arg m "$MARKER" '[ .[] | select(.draft and ( .tag_name == $t or (.name == $t and ((.body // "") | contains($m))) )) ][0].id // empty' releases.json)
          if [ -n "$draft_id" ]; then
            # Always send tag_name. Leaving it out is what rewrites the pending
            # tag to untagged-<id>; uploading the zip by tag then fails with
            # "release not found".
            gh api -X PATCH "repos/${REPO}/releases/${draft_id}" \
              -f tag_name="$TAG" -f name="$TAG" -f target_commitish="$SHA" -f body="$body" \
              -F draft=true -F prerelease="$PRERELEASE" >/dev/null
            echo "Updated draft ${TAG}"
          else
            # Keep the id. The zip is attached to this release, not looked up by tag.
            draft_id=$(gh api -X POST "repos/${REPO}/releases" \
              -f tag_name="$TAG" -f name="$TAG" -f target_commitish="$SHA" -f body="$body" \
              -F draft=true -F prerelease="$PRERELEASE" -q .id)
            echo "Created draft ${TAG}"
          fi

          if [ "$ZIP" = "true" ]; then
            # Upload by release id. `gh release upload "$TAG"` looks the release
            # up by tag and fails with "release not found" once the pending tag
            # has been rewritten to untagged-<id>. The upload endpoint also
            # rejects a second asset of the same name, so delete an existing
            # <domain>.zip on this release first.
            gh api "repos/${REPO}/releases/${draft_id}" > draft.json
            asset_id=$(jq -r --arg n "${DOMAIN}.zip" '[.assets[] | select(.name == $n)][0].id // empty' draft.json)
            if [ -n "$asset_id" ]; then
              gh api -X DELETE "repos/${REPO}/releases/assets/${asset_id}"
              echo "Removed existing ${DOMAIN}.zip"
            fi
            # upload_url ends with the {?name,label} URI template; the POST
            # wants the bare assets URL plus ?name=.
            upload_url=$(jq -r '.upload_url | sub("\\{\\?name,label\\}$"; "")' draft.json)
            gh api -X POST "${upload_url}?name=${DOMAIN}.zip" \
              -H "Content-Type: application/zip" \
              --input "${DOMAIN}.zip" >/dev/null
            echo "Attached ${DOMAIN}.zip"
          fi

          # Remove drafts this workflow made earlier for a different version
          # (after the manifest version was bumped). Hand-made drafts stay.
          # releases.json is the snapshot from before this update, so the draft
          # we just patched is still in it. One this workflow had already
          # untagged has tag_name != $TAG and would match; never delete the
          # draft we just kept.
          jq -r --arg t "$TAG" --arg m "$MARKER" --argjson keep "$draft_id" \
            '.[] | select(.draft and .id != $keep and .tag_name != $t and ((.body // "") | contains($m))) | .id' releases.json |
            while read -r id; do
              gh api -X DELETE "repos/${REPO}/releases/${id}"
              echo "Removed stale draft ${id}"
            done

          {
            echo "### Draft ${TAG}"
            echo
            echo "Review and publish it at https://github.com/${REPO}/releases. Publishing creates the tag."
            echo
            cat body.md
          } >> "$GITHUB_STEP_SUMMARY"
