# Tool settings for this repository's own scripts (scripts/check_repo.py and
# its tests). The same ruff rules as every integration repo
# (templates/repo/pyproject.toml); the Self check workflow runs them.

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
split-on-trailing-comma = false
