# Tool settings only: this repo isn't a Python package, and the version lives
# in custom_components/<domain>/manifest.json. The ruff settings are the same
# in every bisman-automations repo (extend-select adds repo-specific rules).

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
# The oldest Python the minimum Home Assistant runs on (py313 up to 2026.2).
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "homeassistant", "tests"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.coverage.run]
source = ["custom_components/DOMAIN"]

[tool.coverage.report]
show_missing = true
skip_covered = true
